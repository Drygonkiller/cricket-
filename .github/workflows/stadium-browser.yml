name: Check 3D stadium in Chromium
on:
  push:
    branches: [build/super-over-smash-browser]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Retrieve generated stadium from the build branch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            git fetch --quiet --depth=1 origin build/super-over-smash-portable
            if git cat-file -e FETCH_HEAD:assets/cricket_stadium.glb 2>/dev/null; then
              git checkout FETCH_HEAD -- assets/cricket_stadium.glb
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Test scoring and the stadium header
        run: node --test tests/game-logic.test.js tests/stadium-asset.test.js
      - name: Exercise the 3D chase, asset fallback and 2D offline reload
        run: node browser-check.mjs
